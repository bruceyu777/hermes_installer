    - /home/yzhengfeng/git/cc_skills      # fortistack-*, log-intel-*, autolibv3-script-debug (same as default)
memory:
  write_approval: true
curator:
  enabled: false
terminal:
  home_mode: profile
mcp_servers:
  mantis-tools:
    tools:
      include:
        - skill_fos_testscript_dsl
        - skill_fos_cli_reference
        - skill_create_skill
        - cm_get_latest_build
        - cm_get_build_content
