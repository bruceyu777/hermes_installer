# Hosts that Hermes works on or reaches. Git-managed, shared by every install of this repo.
#
# install.sh reads this file, finds the host it is running on — `--host <name>`, else HERMES_HOST
# in tokens.env / ~/.hermes/.env, else auto-detect by hostname or one of `hostname -I` — and renders $HERMES_HOME/HOST.md plus a short managed block in $HERMES_HOME/SOUL.md, so each
# Hermes knows which host it is, what is where, what this host can do, and how to reach the others.
#
# No credentials here. SSH identity for a host comes from ~/.hermes/.env (see tokens.env.example):
#   SSH_<NAME>_USER       login user (NAME = host key upper-cased, '-' and '.' -> '_')
#   SSH_<NAME>_KEY        path to the private key   (preferred)
#   SSH_<NAME>_PASSWORD   password, only for hosts that cannot take a key (used via sshpass)
#   SSH_<NAME>_PORT       optional, default 22
#   RDP_<NAME>_USER / _PASSWORD / _DOMAIN / _PORT   RDP login (xfreerdp/remmina), not for kind: fortigate
#   FGT1_GUI_URL / FGT1_REST_TOKEN                  FortiGate GUI and REST API token
# install.sh turns these into `Host <name>` aliases in ~/.ssh/config.d/hermes_hosts, so the agent
# runs `ssh cdn ...`, never an IP with an inline password.
#
# To add a host: one block under `hosts:`, the SSH_* lines in tokens.env, optionally a `tasks:`
# entry; commit; `git pull && ./install.sh` on every host.
#
# Routing is by capability, not by host name. A skill says what it needs in its SKILL.md frontmatter
# (`metadata: {requires: [capability, ...]}`), a task says `needs: <capability>`, a host lists what it has.
# HOST.md turns each need into `here` / `ssh <alias>` / "not reachable", so when a host moves or a second
# host gains a capability only this file changes. Claude Code and opencode get the same HOST.md through
# `make host` in cc_skills (scripts/render_host_context.py --host-md). Capabilities that skills ask for:
#   jenkins-mcp            the `jenkins` MCP server is registered here (read builds, trigger with user approval)
#   jenkins-master         the jenkins-master container + ~/jenkins-master + ~/resources/tools (batch cascade data)
#   autolib-mongo          the autolib results Mongo (container autolib-mongodb)
#   autolibv3              /home/fosqa/autolibv3 with autotest.py and its venv (compile / parse / rerun a script)
#   fortistack-node-login  FORTISTACK_NODE_PASSWORD in ~/.config/fortistack/env + sshpass + port 22 to the lab nodes
#   logintel-server        the log-intelligence checkout and its docker compose stack (code, DB, redeploy)
#   qaai-replicas          the local QAAI portal / KB map / release-health replicas (pm2, :8080 :9999 :5000)
# Measure reach with `scripts/render_host_context.py --probe` on the host itself; date what you record.

schema_version: 1

networks:
  office:          { cidr: 172.19.136.0/24, note: "corporate office LAN; workstation and laptops" }
  fortistackrobot: { cidr: 10.161.69.0/24, note: "fortistackrobot server segment and the lab nodes node2…node99, chicago-a since 2026-11-10 (the old 10.96.234.0/24 servers are retired); from office1 (probe 2026-11-19): key ssh to cdn and log_intel_server, port 22 open on the nodes" }
  lab:             { cidr: 172.18.0.0/16,   note: "test lab; GUI automation host and FortiGate devices; from office1 (probe 2026-11-19): guiauto1 and fgt1 port 22 open, qaai 172.18.70.57:22 closed (also from cdn and log_intel_server)" }

hosts:
  office1:
    description: "the main workstation; this repo is developed and released here"
    ip: 172.19.136.41
    hostname: VAN-903614-PC6
    network: office
    kind: workstation
    os: ubuntu
    login: { domain: FORTINET-US.COM, user_env: SSH_OFFICE1_USER }   # AD, Kerberos member (`realm list`)
    hermes:
      installed: true
      version: v0.16.0
      profiles: [default, office, engineering, qa]   # target set; today: default, office_automation
      gateway: true                                   # Telegram bots live here, one token per profile
    folders:
      git: ~/git                       # all repos; hermes_installer, cc_skills, log-intelligence client, ECC clone
      hermes_home: ~/.hermes
      skills_shared: ~/git/cc_skills   # symlinked into ~/.claude/skills, shared with opencode and Hermes
      scratch: ~/tmp
    capabilities: [internet, fos-ai-gateway, local-qwen-gateway, jenkins-mcp, mantis-mcp, logintel-mcp, image-builds-mcp, telegram-gateway, git-push, docker, vscode, qaai-replicas]
    # not fortistack-node-login (2026-11-19): the lab nodes answer on port 22 from here, but ~/.config/fortistack/env
    # is missing; creating it (mode 600) would add the capability
    reaches: [office2, office3, cdn, log_intel_server, guiauto1, qaai, fgt1]

  office2:
    description: "my laptop (dual system: Windows + a permanent Ubuntu docker; SSH lands in the Ubuntu container on port 2222)"
    ip: 172.19.136.141
    hostname: VAN-903614-LT1          # NetBIOS name, domain FORTINET-US (nmblookup 2026-10-27)
    network: office
    kind: laptop
    os: ubuntu   # the container; Windows (RDP) is the host underneath
    login: { user_env: SSH_OFFICE2_USER }   # local user fosqa in the container, password login, port 2222
    hermes: { installed: false, profiles: [default], gateway: false }   # no second poller on the same bot token
    folders: { home: /home/fosqa, git: ~/git }   # to confirm
    capabilities: [internet, rdp, fos-ai-gateway, jenkins-mcp, mantis-mcp, logintel-mcp]
    reaches: [office1, cdn, log_intel_server]

  office3:
    description: "my new laptop (dual system: Windows + a permanent Ubuntu docker; SSH lands in the Ubuntu container on port 2222)"
    ip: 172.19.136.147
    hostname: office3-ubuntu   # the container
    network: office
    kind: laptop
    os: ubuntu   # the container; Windows (RDP) is the host underneath
    login: { user_env: SSH_OFFICE3_USER }   # local user fosqa in the container, password login, port 2222
    hermes: { installed: true, version: v0.22.5, profiles: [default], gateway: false }   # no second poller on the same bot token
    folders:
      git: ~/git                       # hermes_installer, claude_skill
      hermes_home: ~/.hermes
      skills_shared: ~/.claude/skills  # installed from ~/git/claude_skill (make push)
    capabilities: [internet, rdp, fos-ai-gateway, local-qwen-gateway, jenkins-mcp, mantis-mcp, logintel-mcp, image-builds-mcp, vscode]
    reaches: [office1, office2, cdn, log_intel_server, guiauto1, qaai, fgt1]

  cdn:
    description: "fortistackrobot server 'cdn': Jenkins master releaseqa-stackjenkins, autolib Mongo, image store"
    ip: 10.161.69.120            # 2026-11-10; the old 10.96.234.39 is retired
    hostname: cdnfortistack
    network: fortistackrobot
    kind: server
    os: ubuntu
    hermes: { installed: false, profiles: [default], gateway: false }
    folders:
      home: /home/fosqa
      git: /home/fosqa/git                            # to confirm
      jenkins_master: /home/fosqa/jenkins-master
      tools: /home/fosqa/resources/tools               # venv used by the triage scripts
      skills: ~/.claude/skills                         # own copies (fortistack-batch-launch, -node-provision, …), not in cc_skills yet
    # jenkins-master, autolib-mongo, docker checked 2026-11-19 (containers jenkins-master, autolib-mongodb);
    # /home/fosqa/autolibv3 here has no autotest.py, so no autolibv3; no ~/.config/fortistack/env; gateways to confirm
    capabilities: [jenkins-master, autolib-mongo, docker, fos-ai-gateway, local-qwen-gateway]
    reaches: [log_intel_server]

  log_intel_server:
    description: "fortistackrobot server running Log Intelligence (docker compose: web-ui, query-svc, ingestion-svc, llm-analysis-svc, postgres)"
    ip: 10.161.69.237            # 2026-11-10, releaseqa-logintelligence; the old 10.96.234.80 is retired
    hostname: all-in-one-node254
    network: fortistackrobot
    kind: server
    os: ubuntu
    hermes: { installed: false, profiles: [default], gateway: false }
    folders:
      home: /home/fosqa
      logintel: /home/fosqa/ai_practice/log-intelligence            # server + shared lib
      logintel_client: /home/fosqa/ai_practice/log-intelligence/log-intel-client   # node agent, separate git repo
      journal: /home/fosqa/ai_practice/journal
      autolibv3: /home/fosqa/autolibv3                 # autotest.py + venv
      skills_repo: /home/fosqa/ai_practice/SKILLS      # cc_skills clone, copy mode (make pull / make push)
    # checked 2026-11-19: the log-intelligence-* compose stack runs; ~/.config/fortistack/env, sshpass and port 22
    # to the lab nodes (node2…node99) are all here, so fortistack node work is done from this host
    # MCP servers jenkins, mantis-tools, logintel, image-builds registered for Claude Code and opencode (checked 2026-11-19)
    capabilities: [docker, postgres, alembic, logintel-server, autolibv3, fortistack-node-login, local-qwen-gateway, jenkins-mcp, mantis-mcp, logintel-mcp, image-builds-mcp]
    reaches: [cdn]

  guiauto1:
    description: "lab host for GUI automation runs"
    ip: 172.18.57.7
    network: lab
    kind: server
    os: ubuntu
    hermes: { installed: false, profiles: [default], gateway: false }
    folders: { home: /home/fosqa }                 # to confirm
    capabilities: [gui-automation, browser, fortigate-access]   # framework (Selenium or other) to confirm
    reaches: [fgt1]

  qaai:
    description: "lab QA-AI host 'qaai' — model training, PMDB image classification, bug-note workflow, triage runs"
    ip: 172.18.70.57
    hostname: qaai
    network: lab
    kind: server
    os: ubuntu   # 24.04.3 LTS, kernel 6.8.0-139, 8 vCPU / 62 GB RAM / 341 GB disk (45% used), no GPU
    login: { user_env: SSH_QAAI_USER }   # local user fosqa; key auth (pubkey installed 2026-10-30)
    hermes: { installed: false, profiles: [default], gateway: false }
    folders:
      home: /home/fosqa                              # 76 GB in use
      qa_tools: /home/fosqa/qa                       # studio, sharing (git repos)
      ai: /home/fosqa/ai                             # bugnote_workflow (git repo)
      model_training: /home/fosqa/model_training_fos # .venv
      scratch: /home/fosqa/sandbox                   # venv
      runs: /home/fosqa/runs                          # also triage_runs, repro_evidence, reports
    capabilities: [python3.12, git, sudo, lxd, model-training]   # no docker, no nvidia GPU
    reaches: [fgt1]

  fgt1:
    description: "lab FortiGate device under test"
    ip: 172.18.62.232
    network: lab
    kind: fortigate                               # FortiOS CLI over ssh, not a Linux host; no Hermes
    hermes: { installed: false }
    capabilities: [fortios-cli, fortios-gui, fortios-rest]
    reaches: []

# Shared lab nodes are a class, not entries: nobody routes work to them and no ssh alias is written for or on them.
# A machine whose hostname is hostname_prefix + a number becomes host name_prefix + that number (all-in-one-node16 -> node16)
# with the facts below; only the machine itself gets this, on itself. An entry under hosts (by hostname or ip) comes first:
# all-in-one-node254 stays log_intel_server. Checked 2026-11-25: all 110 nodes have this hostname form.
lab_nodes:
  hostname_prefix: all-in-one-node
  name_prefix: node
  description: "FortiStack all-in-one lab node; shared login, pipelines run here"
  network: fortistackrobot
  kind: server
  os: ubuntu
  hermes: { installed: true, profiles: [default], gateway: false }
  folders: { home: /home/fosqa, autolibv3: /home/fosqa/autolibv3 }
  capabilities: [fos-ai-gateway]
  reaches: []

# Tasks bound to a host or a capability. An agent on any other host runs the commands there over ssh
# (via the alias); it must not copy the credentials or the data to itself.
#   host: <name>         only that host (identity-bound: a bot token, the repo of record, a device)
#   needs: <capability>  any host that has the capability (preferred: survives host moves)
tasks:
  telegram_gateway:        { host: office1,          why: "one poller per bot token" }
  hermes_installer_release: { host: office1,         why: "repo of record, git push" }
  logintel_db_migration:   { needs: logintel-server, why: "alembic against the postgres container" }
  logintel_redeploy:       { needs: logintel-server, why: "docker compose for the services" }
  logintel_db_query:       { needs: logintel-server, why: "psql in the log-intelligence-postgres-1 container" }
  fortistack_batch_trigger: { needs: jenkins-mcp,    why: "triggerBuild through the MCP, so the user approves it" }
  fortistack_batch_triage: { needs: jenkins-master,  why: "cascade data, autolib Mongo and the tools venv live with the jenkins-master container" }
  fortistack_node_debug:   { needs: fortistack-node-login, why: "sshpass to the lab nodes and FGT consoles needs the node password" }
  autolibv3_script_run:    { needs: autolibv3,       why: "autotest.py compile / parse / rerun needs the autolibv3 checkout and venv" }
  gui_regression_run:      { host: guiauto1,         why: "browser and lab network" }
  fortigate_cli:           { host: fgt1,             why: "device itself; read-only unless the task says otherwise" }
